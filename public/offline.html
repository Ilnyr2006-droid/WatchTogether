<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#080b12">
    <title>Нет соединения с сервером — WatchTogether</title>
    <style>
      :root { color-scheme: dark; font-family: Arial, Helvetica, sans-serif; background: #080b12; color: #f5f7fb; }
      body { display: grid; min-height: 100vh; place-items: center; margin: 0; padding: 24px; }
      main { max-width: 440px; padding: 32px; border: 1px solid #ffffff1a; border-radius: 24px; background: #111620; text-align: center; }
      h1 { margin: 0; font-size: 1.5rem; }
      p { margin: 16px 0 24px; color: #a1aab9; line-height: 1.6; }
      button { min-height: 44px; padding: 0 18px; border: 0; border-radius: 12px; background: #7c3aed; color: white; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет соединения с сервером</h1>
      <p>Для совместного просмотра требуется сеть</p>
      <button type="button" onclick="location.reload()">Повторить подключение</button>
    </main>
  </body>
</html>
